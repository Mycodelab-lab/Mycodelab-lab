<style>
@keyframes fade{to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes sweep{from{transform:translateY(-60px)}to{transform:translateY(700px)}}
@keyframes border{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
.cur{animation:blink 1s step-end infinite}
.sweep{animation:sweep 5s linear infinite}
.frame{animation:border 4s ease-in-out infinite}
.l{opacity:0;animation:slide .4s ease forwards}.f{opacity:0;animation:fade .6s ease forwards}.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) forwards}@keyframes grow{to{transform:scaleX(1)}}.ring{stroke-dasharray:283;stroke-dashoffset:283;animation:ring 1.6s ease-out .6s forwards}@keyframes ring{to{stroke-dashoffset:0}}.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick 1.2s ease-in-out infinite}@keyframes flick{0%,100%{transform:scale(1)}50%{transform:scale(1.12,.92)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s ease-out 1s forwards}@keyframes draw{to{stroke-dashoffset:0}}.area{opacity:0;animation:fade 1s ease 2.4s forwards}.dot{opacity:0;animation:fade .3s ease forwards}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{0%,100%{r:4;opacity:1}50%{r:8;opacity:.3}}
</style>
